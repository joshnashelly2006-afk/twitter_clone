services:
  - type: web
    name: twitter-clone-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && FLASK_ENV=production flask db upgrade"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT \"app:create_app('production')\""
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: twitter-clone-db
          property: connectionString

databases:
  - name: twitter-clone-db
    plan: free
