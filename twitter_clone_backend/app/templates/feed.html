{% extends "base.html" %}

{% block title %}Home / Twitter Clone{% endblock %}

{% block content %}
<header class="feed-header glass-panel sticky-header">
    <h2>Home</h2>
    <div class="feed-tabs">
        <button class="tab-btn active" id="tab-for-you">For You</button>
        <button class="tab-btn" id="tab-following">Following</button>
    </div>
</header>

<div class="compose-post-container glass-panel">
    <div class="compose-avatar">
        <div class="avatar-placeholder"></div>
    </div>
    <div class="compose-form">
        <textarea id="compose-textarea" placeholder="What is happening?!"></textarea>
        
        <!-- Media File Preview Container -->
        <div id="compose-media-preview-area" class="hidden"></div>
        
        <!-- Emoji Picker Container -->
        <div id="compose-emoji-picker-container" class="hidden"></div>

        <div class="compose-actions">
            <div class="compose-tools">
                <label for="compose-file-input" style="cursor:pointer; display:flex; align-items:center;">
                    <i class="ph ph-image" title="Attach Image/Video"></i>
                </label>
                <input type="file" id="compose-file-input" accept="image/*,video/*" style="display:none;">
                <i class="ph ph-gif" title="GIF" id="compose-gif-btn"></i>
                <i class="ph ph-smiley" title="Emoji" id="compose-emoji-btn"></i>
            </div>
            <div class="compose-right-controls">
                <span class="char-counter" id="desktop-char-counter">0/280</span>
                <button class="btn-primary" id="submit-post-btn">Post</button>
            </div>
        </div>
    </div>
</div>

<div class="divider"></div>

<div id="feed-container" class="feed-container">
    <!-- Posts & Skeleton Loader injected here -->
    <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-content">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line full"></div>
            <div class="skeleton-line medium"></div>
        </div>
    </div>
    <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-content">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line full"></div>
        </div>
    </div>
</div>
{% endblock %}
