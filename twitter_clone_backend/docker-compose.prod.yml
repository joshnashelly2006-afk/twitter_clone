version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: twitter_clone_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads_prod_data:/app/uploads:ro
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitter_clone_web_prod
    restart: always
    env_file:
      - .env.production
    volumes:
      - uploads_prod_data:/app/uploads
      - logs_prod_data:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: twitter_clone_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-twitter_clone_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  uploads_prod_data:
  logs_prod_data:
